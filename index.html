<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0d12" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f5f6fa" media="(prefers-color-scheme: light)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="myStreak">
  <meta name="description" content="Alışkanlıklarını takip et, serini koru.">
  <title>myStreak</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script>
    // Tema, ilk boyamadan önce uygulanır (yanıp sönme olmasın)
    try { const t = localStorage.getItem('mystreak_theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
  <style>
    :root {
      --bg: #f5f6fa; --surface: #ffffff; --surface-2: #eef0f6; --text: #0f172a; --muted: #667085;
      --border: #e4e7ef; --shadow: 0 1px 2px rgba(16,24,40,.04), 0 4px 16px rgba(16,24,40,.06);
      --brand: #f97316; --danger: #ef4444; --ok: #22c55e; --warn: #f59e0b;
      --radius: 18px; color-scheme: light;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #0b0d12; --surface: #141821; --surface-2: #1c2130; --text: #e9edf5; --muted: #8b93a7;
        --border: #232a3b; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25); color-scheme: dark;
      }
    }
    :root[data-theme="dark"] {
      --bg: #0b0d12; --surface: #141821; --surface-2: #1c2130; --text: #e9edf5; --muted: #8b93a7;
      --border: #232a3b; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25); color-scheme: dark;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
      background: var(--bg); color: var(--text); min-height: 100vh; -webkit-tap-highlight-color: transparent;
      padding: max(16px, env(safe-area-inset-top)) 16px calc(96px + env(safe-area-inset-bottom));
    }
    button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
    input { font: inherit; color: inherit; }
    svg { display: block; }
    .app { max-width: 560px; margin: 0 auto; }

    /* Header */
    .top { display: flex; align-items: center; justify-content: space-between; padding: 8px 0 18px; }
    .brand { display: flex; align-items: center; gap: 10px; }
    .brand-logo { width: 36px; height: 36px; border-radius: 11px; background: linear-gradient(135deg, #fb923c, #ef4444); display: grid; place-items: center; font-size: 19px; box-shadow: 0 6px 16px rgba(249,115,22,.35); }
    .brand h1 { font-size: 1.25rem; font-weight: 800; letter-spacing: -.02em; }
    .brand small { display: block; font-size: .78rem; color: var(--muted); font-weight: 500; margin-top: 1px; }
    .top-actions { display: flex; align-items: center; gap: 6px; }
    .sync { display: inline-flex; align-items: center; gap: 6px; font-size: .75rem; color: var(--muted); padding: 6px 10px; border-radius: 99px; background: var(--surface); border: 1px solid var(--border); }
    .sync i { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); }
    .sync[data-s="ok"] i { background: var(--ok); }
    .sync[data-s="saving"] i, .sync[data-s="loading"] i { background: var(--warn); animation: pulse 1s infinite; }
    .sync[data-s="offline"] i { background: var(--danger); }
    @keyframes pulse { 50% { opacity: .3; } }
    .icon-btn { width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center; color: var(--muted); background: var(--surface); border: 1px solid var(--border); }
    .icon-btn:hover { color: var(--text); }

    /* Summary */
    .summary { display: flex; align-items: center; gap: 18px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px; box-shadow: var(--shadow); margin-bottom: 22px; }
    .ring { position: relative; width: 76px; height: 76px; flex: none; }
    .ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
    .ring circle { fill: none; stroke-width: 8; }
    .ring .track { stroke: var(--surface-2); }
    .ring .bar { stroke: var(--brand); stroke-linecap: round; transition: stroke-dashoffset .6s cubic-bezier(.2,.8,.2,1); }
    .ring span { position: absolute; inset: 0; display: grid; place-items: center; font-weight: 800; font-size: 1.05rem; }
    .summary h2 { font-size: 1.05rem; font-weight: 700; margin-bottom: 4px; }
    .summary p { font-size: .88rem; color: var(--muted); line-height: 1.4; }

    .section-title { display: flex; justify-content: space-between; align-items: baseline; margin: 0 4px 10px; font-size: .8rem; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }

    /* Habit card */
    .habits { list-style: none; display: flex; flex-direction: column; gap: 12px; }
    .habit { --c: var(--brand); background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; }
    .habit-main { display: flex; align-items: center; gap: 14px; padding: 14px 14px 14px 16px; cursor: pointer; }
    .emoji { width: 46px; height: 46px; flex: none; border-radius: 14px; display: grid; place-items: center; font-size: 22px; background: color-mix(in srgb, var(--c) 16%, transparent); }
    .info { flex: 1; min-width: 0; }
    .name { font-weight: 650; font-size: 1rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .meta { display: flex; align-items: center; gap: 8px; margin-top: 3px; font-size: .8rem; color: var(--muted); }
    .streak-pill { display: inline-flex; align-items: center; gap: 3px; font-weight: 700; color: var(--text); }
    .streak-pill.zero { color: var(--muted); font-weight: 600; }
    .risk { color: var(--warn); font-weight: 600; }
    .week { display: flex; gap: 5px; margin-top: 10px; }
    .day { width: 30px; display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: .64rem; color: var(--muted); font-weight: 600; }
    .day b { width: 22px; height: 22px; border-radius: 7px; background: var(--surface-2); display: block; transition: transform .15s, background .2s; }
    .day.on b { background: var(--c); }
    .day.today b { box-shadow: 0 0 0 2px var(--surface), 0 0 0 3.5px color-mix(in srgb, var(--c) 60%, transparent); }
    .day:active b { transform: scale(.85); }

    .check { width: 52px; height: 52px; flex: none; border-radius: 16px; display: grid; place-items: center; border: 2px solid color-mix(in srgb, var(--c) 45%, var(--border)); color: color-mix(in srgb, var(--c) 70%, var(--muted)); transition: background .2s, color .2s, border-color .2s, transform .15s; }
    .check:active { transform: scale(.9); }
    .habit.done .check { background: var(--c); border-color: var(--c); color: #fff; }
    .habit.done .check.pop { animation: pop .45s cubic-bezier(.2,1.6,.4,1); }
    @keyframes pop { 0% { transform: scale(.7); } 100% { transform: scale(1); } }

    /* Details */
    .details { display: none; border-top: 1px solid var(--border); padding: 16px; }
    .habit.open .details { display: block; animation: fade .25s ease-out; }
    @keyframes fade { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: none; } }
    .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 16px; }
    .stat { background: var(--surface-2); border-radius: 12px; padding: 10px 8px; text-align: center; }
    .stat b { display: block; font-size: 1.15rem; font-weight: 800; }
    .stat span { font-size: .68rem; color: var(--muted); font-weight: 600; }
    .cal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; font-weight: 700; font-size: .92rem; }
    .cal-head button { width: 32px; height: 32px; border-radius: 10px; display: grid; place-items: center; color: var(--muted); }
    .cal-head button:hover { background: var(--surface-2); color: var(--text); }
    .cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; text-align: center; }
    .cal .dn { font-size: .68rem; color: var(--muted); font-weight: 600; padding-bottom: 4px; }
    .cal button { aspect-ratio: 1; border-radius: 10px; font-size: .82rem; font-weight: 500; background: var(--surface-2); }
    .cal button.on { background: var(--c); color: #fff; font-weight: 700; }
    .cal button.today { box-shadow: inset 0 0 0 2px var(--c); }
    .cal button.on.today { box-shadow: inset 0 0 0 2px rgba(255,255,255,.55); }
    .cal button:disabled { background: transparent; color: var(--muted); opacity: .45; cursor: default; }
    .hint { font-size: .75rem; color: var(--muted); margin: 10px 2px 14px; }
    .detail-actions { display: flex; gap: 8px; }
    .btn { flex: 1; display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 11px 14px; border-radius: 12px; background: var(--surface-2); font-weight: 600; font-size: .88rem; }
    .btn:hover { filter: brightness(.97); }
    .btn.danger { color: var(--danger); }
    .btn.primary { background: var(--brand); color: #fff; }

    /* Empty */
    .empty { text-align: center; padding: 48px 20px; color: var(--muted); }
    .empty div { font-size: 44px; margin-bottom: 10px; }
    .empty h3 { color: var(--text); font-size: 1.05rem; margin-bottom: 6px; }

    /* FAB */
    .fab { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(20px + env(safe-area-inset-bottom)); display: inline-flex; align-items: center; gap: 8px; padding: 15px 24px; border-radius: 99px; background: var(--text); color: var(--bg); font-weight: 700; white-space: nowrap; box-shadow: 0 10px 30px rgba(0,0,0,.25); z-index: 20; }
    .fab:active { transform: translateX(-50%) scale(.96); }

    /* Dialog */
    dialog { margin: auto; border: 0; border-radius: 22px; background: var(--surface); color: var(--text); width: min(440px, calc(100% - 32px)); padding: 22px; box-shadow: 0 30px 80px rgba(0,0,0,.35); }
    dialog::backdrop { background: rgba(8,10,16,.55); backdrop-filter: blur(3px); }
    dialog h3 { font-size: 1.15rem; margin-bottom: 16px; }
    .field { margin-bottom: 16px; }
    .field label { display: block; font-size: .78rem; font-weight: 600; color: var(--muted); margin-bottom: 7px; }
    .field input[type="text"], .field input[type="password"] { width: 100%; padding: 13px 14px; border-radius: 12px; border: 1px solid var(--border); background: var(--surface-2); outline: none; font-size: 1rem; }
    .field input:focus { border-color: var(--brand); }
    .emojis { display: grid; grid-template-columns: repeat(8, 1fr); gap: 6px; }
    .emojis button { aspect-ratio: 1; border-radius: 10px; font-size: 20px; background: var(--surface-2); }
    .emojis button.sel { box-shadow: inset 0 0 0 2px var(--text); }
    .colors { display: flex; flex-wrap: wrap; gap: 10px; }
    .colors button { width: 30px; height: 30px; border-radius: 50%; }
    .colors button.sel { box-shadow: 0 0 0 3px var(--surface), 0 0 0 5px var(--text); }
    .dialog-actions { display: flex; gap: 8px; margin-top: 6px; }
    .seg { display: flex; background: var(--surface-2); border-radius: 12px; padding: 4px; }
    .seg button { flex: 1; padding: 9px; border-radius: 9px; font-size: .86rem; font-weight: 600; color: var(--muted); }
    .seg button.sel { background: var(--surface); color: var(--text); box-shadow: var(--shadow); }
    .menu { display: flex; flex-direction: column; gap: 8px; }
    .menu .btn { justify-content: flex-start; }
    .error { color: var(--danger); font-size: .82rem; margin-top: -8px; margin-bottom: 12px; min-height: 1em; }

    /* Toast */
    .toast { position: fixed; left: 50%; bottom: calc(90px + env(safe-area-inset-bottom)); transform: translate(-50%, 20px); background: var(--text); color: var(--bg); padding: 11px 18px; border-radius: 12px; font-size: .88rem; font-weight: 600; opacity: 0; pointer-events: none; transition: .25s; z-index: 50; max-width: calc(100% - 32px); text-align: center; }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }

    @media (max-width: 400px) {
      .day { width: 26px; } .day b { width: 19px; height: 19px; border-radius: 6px; }
      .stats { grid-template-columns: repeat(2, 1fr); }
    }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
  </style>
</head>
<body>
  <div class="app">
    <header class="top">
      <div class="brand">
        <div class="brand-logo">🔥</div>
        <div><h1>myStreak</h1><small id="todayLabel"></small></div>
      </div>
      <div class="top-actions">
        <span class="sync" id="sync" data-s="loading"><i></i><span>Yükleniyor</span></span>
        <button class="icon-btn" data-action="settings" aria-label="Ayarlar">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        </button>
      </div>
    </header>

    <section class="summary" id="summary"></section>
    <div class="section-title" id="listTitle"></div>
    <ul class="habits" id="habits"></ul>
  </div>

  <button class="fab" data-action="add">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
    Yeni alışkanlık
  </button>

  <!-- Ekle / düzenle -->
  <dialog id="habitDialog">
    <form method="dialog" id="habitForm">
      <h3 id="habitDialogTitle">Yeni alışkanlık</h3>
      <div class="field">
        <label for="habitName">İsim</label>
        <input type="text" id="habitName" maxlength="60" placeholder="ör. 20 dk kitap oku" autocomplete="off" required>
      </div>
      <div class="field"><label>Simge</label><div class="emojis" id="emojiPicker"></div></div>
      <div class="field"><label>Renk</label><div class="colors" id="colorPicker"></div></div>
      <div class="dialog-actions">
        <button type="button" class="btn" data-action="close-dialog">Vazgeç</button>
        <button type="submit" class="btn primary" value="save">Kaydet</button>
      </div>
    </form>
  </dialog>

  <!-- Ayarlar -->
  <dialog id="settingsDialog">
    <h3>Ayarlar</h3>
    <div class="field">
      <label>Tema</label>
      <div class="seg" id="themeSeg">
        <button data-theme-opt="system">Sistem</button><button data-theme-opt="light">Açık</button><button data-theme-opt="dark">Koyu</button>
      </div>
    </div>
    <div class="field">
      <label>Veri</label>
      <div class="menu">
        <button class="btn" data-action="export">⬇️&nbsp; Yedeği indir (JSON)</button>
        <button class="btn" data-action="import">⬆️&nbsp; Yedekten geri yükle</button>
        <button class="btn" data-action="restore-legacy">🛟&nbsp; Eski tarayıcı verilerini kurtar</button>
        <button class="btn" data-action="logout" id="logoutBtn">🔒&nbsp; Bu cihazda oturumu kapat</button>
      </div>
      <input type="file" id="importFile" accept="application/json,.json" hidden>
    </div>
    <p class="hint" id="modeInfo"></p>
    <div class="dialog-actions"><button class="btn" data-action="close-dialog">Kapat</button></div>
  </dialog>

  <!-- Şifre -->
  <dialog id="loginDialog">
    <form id="loginForm" method="dialog">
      <h3>🔒 Giriş</h3>
      <div class="field">
        <label for="passInput">Uygulama şifresi</label>
        <input type="password" id="passInput" autocomplete="current-password" required>
      </div>
      <div class="error" id="loginError"></div>
      <div class="dialog-actions"><button type="submit" class="btn primary" value="login">Giriş yap</button></div>
    </form>
  </dialog>

  <div class="toast" id="toast"></div>

  <script>
    'use strict';

    // ---------- Sabitler ----------
    const API = '/api/habits';
    const K = { cache: 'mystreak_cache_v2', dirty: 'mystreak_dirty', pass: 'mystreak_pass', theme: 'mystreak_theme' };
    const COLORS = ['#f97316', '#ef4444', '#ec4899', '#a855f7', '#6366f1', '#3b82f6', '#06b6d4', '#10b981', '#84cc16', '#eab308'];
    const EMOJIS = ['🔥', '📚', '💪', '🏃', '🧘', '💧', '🥗', '😴', '✍️', '💻', '🎸', '🧠', '🚭', '🙏', '🌅', '💰'];
    const MONTHS = ['Ocak', 'Şubat', 'Mart', 'Nisan', 'Mayıs', 'Haziran', 'Temmuz', 'Ağustos', 'Eylül', 'Ekim', 'Kasım', 'Aralık'];
    const DAYS = ['Paz', 'Pzt', 'Sal', 'Çar', 'Per', 'Cum', 'Cmt'];
    const ICON_CHECK = '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';

    // ---------- Durum ----------
    let habits = [];
    let mode = location.protocol === 'file:' ? 'local' : 'unknown'; // 'cloud' | 'local' | 'unknown'
    let openId = null;
    const calView = {};          // habitId -> {y, m}
    let editingId = null, draft = null, popId = null;

    // ---------- Yardımcılar ----------
    const $ = (s) => document.querySelector(s);
    const pad = (n) => String(n).padStart(2, '0');
    const keyOf = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; // yerel saat
    const parseKey = (k) => { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d); };
    const addDays = (d, n) => { const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); x.setDate(x.getDate() + n); return x; };
    function todayKey() { return keyOf(new Date()); }
    const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const store = {
      get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
      set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
      del(k) { try { localStorage.removeItem(k); } catch (e) {} },
    };
    function toast(msg) {
      const t = $('#toast'); t.textContent = msg; t.classList.add('show');
      clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('show'), 2200);
    }

    // ---------- Seri hesapları (tek doğru kaynak: history) ----------
    function runEndingAt(set, date) {
      let n = 0, d = date;
      while (set.has(keyOf(d))) { n++; d = addDays(d, -1); }
      return n;
    }
    function statsOf(h) {
      const set = new Set(h.history);
      const today = new Date();
      const doneToday = set.has(keyOf(today));
      // Bugün henüz yapılmadıysa dünkü seri hâlâ yaşıyor sayılır
      const current = doneToday ? runEndingAt(set, today) : runEndingAt(set, addDays(today, -1));
      let best = 0, run = 0, prev = null;
      for (const k of h.history) { // history sıralı
        run = prev && keyOf(addDays(parseKey(prev), 1)) === k ? run + 1 : 1;
        best = Math.max(best, run); prev = k;
      }
      const startCandidates = [new Date(h.createdAt)];
      if (h.history.length) startCandidates.push(parseKey(h.history[0]));
      const start = new Date(Math.min(...startCandidates));
      const age = Math.floor((addDays(today, 0) - addDays(start, 0)) / 864e5) + 1;
      const window = Math.max(1, Math.min(30, age));
      let hits = 0;
      for (let i = 0; i < window; i++) if (set.has(keyOf(addDays(today, -i)))) hits++;
      return { doneToday, current, best, total: set.size, rate: Math.round((hits / window) * 100), atRisk: !doneToday && current > 0 };
    }

    // ---------- Veri normalizasyonu + eski formattan geçiş ----------
    function normalize(raw) {
      const list = Array.isArray(raw) ? raw : (raw && Array.isArray(raw.habits) ? raw.habits : []);
      const seen = new Set();
      return list.filter((h) => h && typeof h.name === 'string' && h.name.trim()).map((h, i) => {
        let id = Number(h.id) || Date.now() + i;
        while (seen.has(id)) id++;
        seen.add(id);
        const history = [...new Set((Array.isArray(h.history) ? h.history : []).filter((k) => /^\d{4}-\d{2}-\d{2}$/.test(k)))].sort();
        // Eski sürümde "streak" elle düzenlenebilen bir sayıydı. Geçmişte o kadar gün yoksa,
        // son işaretlenen günden (yoksa dünden) geriye doğru tamamlıyoruz ki serin kaybolmasın.
        const legacy = parseInt(h.streak, 10) || 0;
        if (legacy > 0) {
          const set = new Set(history);
          const end = history.length ? parseKey(history[history.length - 1]) : addDays(new Date(), -1);
          const have = runEndingAt(set, end);
          for (let n = have; n < legacy; n++) set.add(keyOf(addDays(end, -n)));
          history.splice(0, history.length, ...[...set].sort());
        }
        const created = Number(h.createdAt) || (id < 1e13 && id > 1e12 ? id : Date.now());
        return {
          id, name: h.name.trim().slice(0, 60),
          emoji: typeof h.emoji === 'string' && h.emoji ? h.emoji : '🔥',
          color: /^#[0-9a-f]{6}$/i.test(h.color) ? h.color : COLORS[i % COLORS.length],
          createdAt: created, history,
        };
      });
    }
    const needsMigration = (raw) => {
      const list = Array.isArray(raw) ? raw : (raw && raw.habits) || [];
      return list.some((h) => h && ('streak' in h || !h.color || !h.createdAt));
    };

    // ---------- Senkronizasyon ----------
    function setSync(s) {
      const labels = { ok: 'Senkron', saving: 'Kaydediliyor', loading: 'Yükleniyor', offline: 'Çevrimdışı', local: 'Bu cihazda' };
      const el = $('#sync'); el.dataset.s = s; el.lastElementChild.textContent = labels[s] || s;
    }
    async function api(method, body) {
      const headers = { 'Content-Type': 'application/json' };
      const p = store.get(K.pass); if (p) headers['X-App-Password'] = p;
      return fetch(API, { method, headers, cache: 'no-store', body: body ? JSON.stringify(body) : undefined });
    }
    const payload = () => ({ version: 2, updatedAt: Date.now(), habits });

    async function load() {
      const cached = store.get(K.cache);
      if (cached) { try { habits = normalize(JSON.parse(cached)); } catch (e) {} }
      render();
      if (mode === 'local') { setSync('local'); return; }
      setSync('loading');
      try {
        // Çevrimdışıyken yapılmış değişiklik varsa önce onları gönder
        if (store.get(K.dirty) && cached) { await push(); if (store.get(K.dirty)) return; }
        const r = await api('GET');
        if (r.status === 401) return askLogin();
        if (r.status === 404 || !(r.headers.get('content-type') || '').includes('json')) { mode = 'local'; setSync('local'); return; }
        if (!r.ok) throw new Error(r.status);
        const data = await r.json();
        mode = 'cloud';
        habits = normalize(data);
        store.set(K.cache, JSON.stringify(payload()));
        render(); setSync('ok');
        if (needsMigration(data)) scheduleSave();
      } catch (e) {
        console.error(e); setSync('offline');
      }
    }

    let saveTimer = null;
    function commit() {
      store.set(K.cache, JSON.stringify(payload()));
      render();
      if (mode === 'local') { setSync('local'); return; }
      store.set(K.dirty, '1');
      scheduleSave();
    }
    function scheduleSave() {
      setSync('saving');
      clearTimeout(saveTimer);
      saveTimer = setTimeout(push, 500);
    }
    async function push() {
      saveTimer = null;
      try {
        const r = await api('PUT', payload());
        if (r.status === 401) return askLogin();
        if (!r.ok) throw new Error(r.status);
        store.del(K.dirty); mode = 'cloud'; setSync('ok');
      } catch (e) {
        console.error(e); setSync('offline');
      }
    }
    window.addEventListener('online', () => { if (store.get(K.dirty)) push(); });

    function askLogin(error) {
      setSync('offline');
      $('#loginError').textContent = error || (store.get(K.pass) ? 'Şifre yanlış.' : '');
      $('#passInput').value = '';
      if (!$('#loginDialog').open) $('#loginDialog').showModal();
    }
    $('#loginForm').addEventListener('submit', (e) => {
      e.preventDefault();
      store.set(K.pass, $('#passInput').value);
      $('#loginDialog').close();
      load();
    });
    $('#loginDialog').addEventListener('cancel', (e) => e.preventDefault());

    // ---------- İşlemler ----------
    const find = (id) => habits.find((h) => h.id === id);
    function toggleDay(id, key) {
      const h = find(id); if (!h || key > todayKey()) return;
      const i = h.history.indexOf(key);
      if (i >= 0) h.history.splice(i, 1);
      else { h.history.push(key); h.history.sort(); }
      if (key === todayKey() && i < 0) {
        popId = id;
        if (navigator.vibrate) navigator.vibrate(12);
        const s = statsOf(h);
        if (s.current > 1 && (s.current % 7 === 0 || s.current === s.best)) toast(`${h.emoji} ${s.current} günlük seri! Devam 🔥`);
      }
      commit();
    }
    function deleteHabit(id) {
      const h = find(id);
      if (!h || !confirm(`"${h.name}" ve tüm geçmişi silinsin mi?`)) return;
      habits = habits.filter((x) => x.id !== id);
      if (openId === id) openId = null;
      commit(); toast('Silindi');
    }
    function moveHabit(id, dir) {
      const i = habits.findIndex((h) => h.id === id), j = i + dir;
      if (i < 0 || j < 0 || j >= habits.length) return;
      [habits[i], habits[j]] = [habits[j], habits[i]];
      commit();
    }

    // ---------- Arayüz ----------
    function render() {
      const today = new Date(), tk = keyOf(today);
      $('#todayLabel').textContent = today.toLocaleDateString('tr-TR', { weekday: 'long', day: 'numeric', month: 'long' });

      const all = habits.map((h) => [h, statsOf(h)]);
      const done = all.filter(([, s]) => s.doneToday).length;
      const total = habits.length;
      const pct = total ? done / total : 0;
      const C = 2 * Math.PI * 32;
      let title, sub;
      if (!total) { title = 'Hoş geldin 👋'; sub = 'İlk alışkanlığını ekleyerek serine başla.'; }
      else if (done === total) { title = 'Bugün tamam! 🎉'; sub = 'Tüm alışkanlıklarını bitirdin. Yarın görüşürüz.'; }
      else {
        const risk = all.filter(([, s]) => s.atRisk).length;
        title = `${total - done} alışkanlık kaldı`;
        sub = risk ? `${risk} serin bugün yapmazsan sıfırlanacak.` : 'Küçük adımlar, uzun seriler.';
      }
      $('#summary').innerHTML = `
        <div class="ring"><svg viewBox="0 0 76 76"><circle class="track" cx="38" cy="38" r="32"/>
          <circle class="bar" cx="38" cy="38" r="32" stroke-dasharray="${C}" stroke-dashoffset="${C * (1 - pct)}"/></svg>
          <span>${done}/${total}</span></div>
        <div><h2>${title}</h2><p>${sub}</p></div>`;

      $('#listTitle').innerHTML = total ? `<span>Alışkanlıklar</span><span>${total}</span>` : '';

      const list = $('#habits');
      if (!total) {
        list.innerHTML = `<li class="empty"><div>🌱</div><h3>Henüz alışkanlık yok</h3><p>Aşağıdaki butona dokunarak başla.</p></li>`;
        return;
      }
      list.innerHTML = all.map(([h, s], idx) => {
        const set = new Set(h.history);
        let week = '';
        for (let i = 6; i >= 0; i--) {
          const d = addDays(today, -i), k = keyOf(d);
          week += `<button class="day${set.has(k) ? ' on' : ''}${i === 0 ? ' today' : ''}" data-action="toggle" data-date="${k}" aria-label="${d.getDate()} ${MONTHS[d.getMonth()]}">${DAYS[d.getDay()].slice(0, 2)}<b></b></button>`;
        }
        const streak = s.current
          ? `<span class="streak-pill">🔥 ${s.current} gün</span>`
          : `<span class="streak-pill zero">Seri yok</span>`;
        const extra = s.atRisk ? '<span class="risk">· bugün yap!</span>' : (s.best > s.current ? `<span>· en iyi ${s.best}</span>` : '');
        const open = openId === h.id;
        return `
          <li class="habit${s.doneToday ? ' done' : ''}${open ? ' open' : ''}" style="--c:${h.color}" data-id="${h.id}">
            <div class="habit-main" data-action="expand">
              <div class="emoji">${esc(h.emoji)}</div>
              <div class="info">
                <div class="name">${esc(h.name)}</div>
                <div class="meta">${streak}${extra}</div>
                <div class="week">${week}</div>
              </div>
              <button class="check${popId === h.id ? ' pop' : ''}" data-action="toggle" data-date="${tk}" aria-label="Bugünü işaretle">${ICON_CHECK}</button>
            </div>
            ${open ? detailsHTML(h, s, idx) : ''}
          </li>`;
      }).join('');
      popId = null;
    }

    function detailsHTML(h, s, idx) {
      const today = new Date(), tk = keyOf(today);
      const v = calView[h.id] || (calView[h.id] = { y: today.getFullYear(), m: today.getMonth() });
      const set = new Set(h.history);
      const first = new Date(v.y, v.m, 1);
      const lead = (first.getDay() + 6) % 7; // Pazartesi başlangıç
      const days = new Date(v.y, v.m + 1, 0).getDate();
      let cal = ['Pzt', 'Sal', 'Çar', 'Per', 'Cum', 'Cmt', 'Paz'].map((d) => `<div class="dn">${d}</div>`).join('');
      cal += '<div></div>'.repeat(lead);
      for (let d = 1; d <= days; d++) {
        const k = keyOf(new Date(v.y, v.m, d));
        cal += `<button class="${set.has(k) ? 'on' : ''}${k === tk ? ' today' : ''}" data-action="toggle" data-date="${k}"${k > tk ? ' disabled' : ''}>${d}</button>`;
      }
      const isCurrentMonth = v.y === today.getFullYear() && v.m === today.getMonth();
      return `
        <div class="details">
          <div class="stats">
            <div class="stat"><b>${s.current}</b><span>Mevcut seri</span></div>
            <div class="stat"><b>${s.best}</b><span>En iyi seri</span></div>
            <div class="stat"><b>${s.total}</b><span>Toplam gün</span></div>
            <div class="stat"><b>%${s.rate}</b><span>Son 30 gün</span></div>
          </div>
          <div class="cal-head">
            <button data-action="month" data-dir="-1" aria-label="Önceki ay"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M15 18l-6-6 6-6"/></svg></button>
            <span>${MONTHS[v.m]} ${v.y}</span>
            <button data-action="month" data-dir="1" aria-label="Sonraki ay"${isCurrentMonth ? ' disabled style="opacity:.3"' : ''}><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M9 18l6-6-6-6"/></svg></button>
          </div>
          <div class="cal">${cal}</div>
          <p class="hint">Unuttuğun bir günü işaretlemek ya da yanlışlıkla işaretlediğini geri almak için takvimdeki güne dokun.</p>
          <div class="detail-actions">
            <button class="btn" data-action="up"${idx === 0 ? ' disabled style="opacity:.4"' : ''} aria-label="Yukarı taşı">↑</button>
            <button class="btn" data-action="down"${idx === habits.length - 1 ? ' disabled style="opacity:.4"' : ''} aria-label="Aşağı taşı">↓</button>
            <button class="btn" data-action="edit">✏️ Düzenle</button>
            <button class="btn danger" data-action="delete">🗑️ Sil</button>
          </div>
        </div>`;
    }

    // ---------- Ekle / Düzenle diyaloğu ----------
    function openHabitDialog(id) {
      editingId = id || null;
      const h = id ? find(id) : null;
      draft = { emoji: h ? h.emoji : EMOJIS[0], color: h ? h.color : COLORS[habits.length % COLORS.length] };
      $('#habitDialogTitle').textContent = h ? 'Alışkanlığı düzenle' : 'Yeni alışkanlık';
      $('#habitName').value = h ? h.name : '';
      paintPickers();
      $('#habitDialog').showModal();
      setTimeout(() => $('#habitName').focus(), 50);
    }
    function paintPickers() {
      const emojis = EMOJIS.includes(draft.emoji) ? EMOJIS : [draft.emoji, ...EMOJIS.slice(0, -1)];
      $('#emojiPicker').innerHTML = emojis.map((e) => `<button type="button" data-emoji="${e}" class="${e === draft.emoji ? 'sel' : ''}">${e}</button>`).join('');
      $('#colorPicker').innerHTML = COLORS.map((c) => `<button type="button" data-color="${c}" style="background:${c}" class="${c === draft.color ? 'sel' : ''}" aria-label="${c}"></button>`).join('');
    }
    $('#emojiPicker').addEventListener('click', (e) => { const b = e.target.closest('[data-emoji]'); if (b) { draft.emoji = b.dataset.emoji; paintPickers(); } });
    $('#colorPicker').addEventListener('click', (e) => { const b = e.target.closest('[data-color]'); if (b) { draft.color = b.dataset.color; paintPickers(); } });
    $('#habitForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const name = $('#habitName').value.trim().slice(0, 60);
      if (!name) return;
      if (editingId) Object.assign(find(editingId), { name, ...draft });
      else {
        const h = { id: Date.now(), name, ...draft, createdAt: Date.now(), history: [] };
        habits.push(h);
      }
      $('#habitDialog').close();
      commit();
    });

    // ---------- Ayarlar ----------
    function openSettings() {
      const t = store.get(K.theme) || 'system';
      document.querySelectorAll('[data-theme-opt]').forEach((b) => b.classList.toggle('sel', b.dataset.themeOpt === t));
      $('#logoutBtn').style.display = store.get(K.pass) ? '' : 'none';
      $('#modeInfo').textContent = mode === 'cloud'
        ? 'Verilerin buluta kaydediliyor; tüm cihazlarında aynı.'
        : 'Bulut bağlantısı yok — veriler sadece bu tarayıcıda saklanıyor. Yedek indirmeyi unutma.';
      $('#settingsDialog').showModal();
    }
    $('#themeSeg').addEventListener('click', (e) => {
      const b = e.target.closest('[data-theme-opt]'); if (!b) return;
      const t = b.dataset.themeOpt;
      if (t === 'system') { store.del(K.theme); delete document.documentElement.dataset.theme; }
      else { store.set(K.theme, t); document.documentElement.dataset.theme = t; }
      document.querySelectorAll('[data-theme-opt]').forEach((x) => x.classList.toggle('sel', x === b));
    });
    function exportData() {
      const blob = new Blob([JSON.stringify(payload(), null, 2)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob); a.download = `mystreak-yedek-${todayKey()}.json`;
      a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    }
    $('#importFile').addEventListener('change', async (e) => {
      const f = e.target.files[0]; e.target.value = '';
      if (!f) return;
      try {
        const data = normalize(JSON.parse(await f.text()));
        if (!data.length) throw new Error('empty');
        if (!confirm(`${data.length} alışkanlık yüklenecek ve mevcut verilerin yerine geçecek. Devam?`)) return;
        habits = data; commit(); $('#settingsDialog').close(); toast('Yedek yüklendi');
      } catch (err) { toast('Geçersiz yedek dosyası'); }
    });
    function restoreLegacy() {
      const raw = store.get('habits_v2') || store.get('habits');
      if (!raw) return toast('Bu tarayıcıda eski veri bulunamadı');
      try {
        const old = normalize(JSON.parse(raw));
        const names = new Set(habits.map((h) => h.name.toLowerCase()));
        const add = old.filter((h) => !names.has(h.name.toLowerCase()));
        if (!add.length) return toast('Eski verilerin zaten mevcut');
        if (!confirm(`${add.length} eski alışkanlık bulundu. Listeye eklensin mi?`)) return;
        habits.push(...add); commit(); $('#settingsDialog').close(); toast('Eski veriler eklendi');
      } catch (e) { toast('Eski veri okunamadı'); }
    }

    // ---------- Olay yönetimi ----------
    document.addEventListener('click', (e) => {
      const el = e.target.closest('[data-action]'); if (!el || el.disabled) return;
      const li = el.closest('.habit'); const id = li ? Number(li.dataset.id) : null;
      switch (el.dataset.action) {
        case 'toggle': toggleDay(id, el.dataset.date); break;
        case 'expand': openId = openId === id ? null : id; render(); break;
        case 'month': {
          const v = calView[id]; const d = new Date(v.y, v.m + Number(el.dataset.dir), 1);
          calView[id] = { y: d.getFullYear(), m: d.getMonth() }; render(); break;
        }
        case 'up': moveHabit(id, -1); break;
        case 'down': moveHabit(id, 1); break;
        case 'edit': openHabitDialog(id); break;
        case 'delete': deleteHabit(id); break;
        case 'add': openHabitDialog(); break;
        case 'settings': openSettings(); break;
        case 'close-dialog': el.closest('dialog').close(); break;
        case 'export': exportData(); break;
        case 'import': $('#importFile').click(); break;
        case 'restore-legacy': restoreLegacy(); break;
        case 'logout':
          if (confirm('Bu cihazdaki şifre ve önbellek silinsin mi?')) { store.del(K.pass); store.del(K.cache); store.del(K.dirty); location.reload(); }
          break;
      }
    });

    // Gece yarısı geçince ya da uygulamaya geri dönünce tazele
    let lastToday = todayKey();
    function refreshIfNewDay() { const t = todayKey(); if (t !== lastToday) { lastToday = t; render(); } }
    setInterval(refreshIfNewDay, 60 * 1000);
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState !== 'visible') return;
      refreshIfNewDay();
      if (mode === 'cloud' && !store.get(K.dirty) && !saveTimer) load();
    });

    load();
  </script>
</body>
</html>
